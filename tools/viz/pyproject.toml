[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ocudu-viz"
version = "0.1.0"
description = "Browser-based visualizer for OCUDU artifacts."
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "ocudu-parsers"]

[project.optional-dependencies]
test = ["httpx"]

[project.scripts]
ocudu-viz = "viz.cli:main"

[tool.setuptools.packages.find]
include = ["viz*"]

[tool.setuptools.package-data]
viz = ["static/*", "static/**/*"]
