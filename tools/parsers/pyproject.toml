[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ocudu-parsers"
version = "0.1.0"
description = "Parsers and decoders for OCUDU artifacts (logs, pcaps, traces)."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
pandas = ["pandas"]

[tool.setuptools.packages.find]
include = ["parsers*"]
